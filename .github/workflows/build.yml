name: Build Windows exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade requests playwright pyinstaller
      - name: Build exe (windowed GUI app, no console)
        run: python -m PyInstaller --onefile --windowed --name CSGORollArb --collect-all playwright arb_bot.py
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: CSGORollArb-windows
          path: dist/CSGORollArb.exe
